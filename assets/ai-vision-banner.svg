<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Oleh Rudko</title>
  <desc id="desc">A personal view of software, AI and learning by building. An illustrated loop connects a question, context, an attempt and a check.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#141718"/><stop offset="1" stop-color="#202b27"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b7c0bb" opacity=".09"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" fill="none" stroke="#7ce4be" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="20" fill="url(#paper)"/>
  <rect width="1200" height="420" rx="20" fill="url(#dots)"/>
  <circle cx="1157" cy="39" r="148" fill="#7ce4be" opacity=".045"/>
  <circle cx="708" cy="429" r="130" fill="#efbb81" opacity=".045"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="46" width="38" height="38" rx="11" fill="#203c32" stroke="#4a7160"/>
    <text x="75" y="71" text-anchor="middle" fill="#7ce4be" font-size="13" font-weight="700">OR</text>
    <text x="111" y="71" fill="#b7c0bb" font-size="13" letter-spacing="2">SOFTWARE / AI / PERSONAL NOTES</text>
    <text x="57" y="199" fill="#f1f3ef" font-family="Georgia, 'Times New Roman', serif" font-size="91" letter-spacing="-4">Oleh Rudko</text>
    <path d="M62 218Q262 230 523 215" fill="none" stroke="#7ce4be" stroke-width="3" stroke-linecap="round"/>
    <text x="62" y="272" fill="#d0d9d2" font-size="23">Exploring what people can build with AI.</text>
    <text x="62" y="364" fill="#b7c0bb" font-size="15">MY AI VISION</text>
    <text x="205" y="364" fill="#56645c" font-size="15">/</text>
    <text x="230" y="364" fill="#efbb81" font-size="15">LEARNING THROUGH PRACTICE</text>
  </g>
  <path d="M814 96Q949 18 1041 101" fill="none" stroke="#7ce4be" stroke-width="2" opacity=".8" marker-end="url(#arrow)"/>
  <path d="M1086 168Q1171 251 1068 294" fill="none" stroke="#7ce4be" stroke-width="2" opacity=".8" marker-end="url(#arrow)"/>
  <path d="M1000 346Q854 414 777 332" fill="none" stroke="#7ce4be" stroke-width="2" opacity=".8" marker-end="url(#arrow)"/>
  <path d="M741 257Q656 174 751 117" fill="none" stroke="#7ce4be" stroke-width="2" opacity=".8" marker-end="url(#arrow)"/>
  <g transform="rotate(-7 781 120)" font-family="Arial, Helvetica, sans-serif">
    <rect x="690" y="74" width="180" height="92" rx="13" fill="#203c32" stroke="#608c74"/>
    <text x="709" y="102" fill="#7ce4be" font-size="12" letter-spacing="1.5">01 / A QUESTION</text>
    <text x="709" y="139" fill="#f1f3ef" font-size="20" font-weight="700">Where do I start?</text>
  </g>
  <g transform="rotate(6 1034 126)" font-family="Arial, Helvetica, sans-serif">
    <rect x="942" y="80" width="185" height="92" rx="13" fill="#3b3026" stroke="#967859"/>
    <text x="961" y="108" fill="#efbb81" font-size="12" letter-spacing="1.5">02 / CONTEXT</text>
    <text x="961" y="145" fill="#f1f3ef" font-size="20" font-weight="700">What matters?</text>
  </g>
  <g transform="rotate(-5 1032 305)" font-family="Arial, Helvetica, sans-serif">
    <rect x="940" y="259" width="185" height="92" rx="13" fill="#3b2a29" stroke="#926b65"/>
    <text x="959" y="287" fill="#f49d8d" font-size="12" letter-spacing="1.5">03 / PRACTICE</text>
    <text x="959" y="324" fill="#f1f3ef" font-size="20" font-weight="700">Try the idea.</text>
  </g>
  <g transform="rotate(6 781 300)" font-family="Arial, Helvetica, sans-serif">
    <rect x="691" y="254" width="180" height="92" rx="13" fill="#203c32" stroke="#608c74"/>
    <text x="710" y="282" fill="#7ce4be" font-size="12" letter-spacing="1.5">04 / EVIDENCE</text>
    <text x="710" y="319" fill="#f1f3ef" font-size="20" font-weight="700">Did it work?</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="908" y="216" fill="#d9e1db" font-size="22" font-style="italic">learn as you go</text>
  </g>
</svg>
